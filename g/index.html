<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Ghost Chat</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0E0F12;
      color: #EDEDEF;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      background: #1B1D24;
      border: 1px solid #2E303B;
      border-radius: 20px;
      padding: 36px 28px;
      max-width: 360px;
      width: 100%;
      text-align: center;
    }
    .icon {
      width: 64px;
      height: 64px;
      margin: 0 auto 20px;
      border-radius: 50%;
      background: #24262F;
      border: 1.5px solid #2E303B;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
    }
    h1 { font-size: 20px; font-weight: 700; margin-bottom: 10px; }
    p { font-size: 14px; color: #9A9CA8; line-height: 1.6; margin-bottom: 28px; }
    .btn {
      display: block;
      width: 100%;
      padding: 14px;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 700;
      text-decoration: none;
      margin-bottom: 12px;
      cursor: pointer;
      border: none;
    }
    .btn-primary { background: #3DFFA3; color: #000; }
    .note { font-size: 12px; color: #5C5E6B; margin-top: 20px; }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">👻</div>
    <h1>Ghost Chat</h1>
    <p>شخص بيحب يكلمك بشكل مجهول تماماً.<br/>حمّل الأبلكيشن عشان تقدر ترد عليه.</p>
    <a id="store-btn" href="#" class="btn btn-primary">حمّل الأبلكيشن</a>
    <p class="note">المحادثة هتتمسح تلقائياً بعد 24 ساعة</p>
  </div>
  <script>
    const code = window.location.pathname.split('/g/')[1];
    if (code) localStorage.setItem('pending_link_code', code);
    const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent);
    const storeBtn = document.getElementById('store-btn');
    if (isIOS) {
      storeBtn.href = 'https://apps.apple.com/app/PLACEHOLDER';
      storeBtn.textContent = 'حمّل من App Store';
    } else {
      storeBtn.href = 'https://play.google.com/store/apps/details?id=com.example.ghost_talk';
      storeBtn.textContent = 'حمّل من Google Play';
    }
  </script>
</body>
</html>
